<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonic vault pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="detail.js"></script>
</head>
<body>
<main>

<header class="top center">
	<a href="./" class="square" aria-label="back to library"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></a>
	<span id="meta" class="grow dim small"></span>
	<span id="new" class="badge" hidden>new</span>
</header>

<p id="missing" hidden>that pattern isn't in the vault. <a href="./">back to the library</a></p>

<div id="detail" class="stack">
	<section>
		<label>
			<span class="visually-hidden">pattern name</span>
			<input id="name" class="title-input" type="text" placeholder="name it…">
		</label>
		<div id="tags" class="chips wrap"></div>
	</section>

	<section class="grid-box">
		<div id="grid" class="grid"></div>
		<div class="legend dim small">
			<span><i class="hit"></i>hit</span>
			<span><i class="hit"><b class="dot"></b></i>parameter lock</span>
			<span><i class="accent"></i>accent</span>
			<span><i class="hit"><b>2</b></i>multiplier</span>
			<span><i class="fx"></i>effect</span>
		</div>
		<p class="dim small">effects play on the tonic only, not in the browser. pitch locks aren't played yet.</p>
	</section>

	<section class="transport">
		<button id="play" class="play-big" aria-label="play pattern"></button>
		<label class="field"><span class="dim small">bpm</span><input id="bpm" type="number" min="60" max="240" inputmode="numeric"></label>
		<label class="field"><span class="dim small">swing</span><input id="swing" type="number" min="0" max="18" inputmode="numeric"></label>
	</section>
	<p id="no-sounds" class="dim small" hidden>the sounds this pattern was recorded with aren't in the vault, so it can't play.</p>

	<section>
		<button id="delete" class="outline">delete pattern</button>
	</section>
</div>

</main>
</body>
</html>
